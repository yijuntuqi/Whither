<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whither · 旅行规划助手</title>
<style>
  :root {
    --bg: #f4f6fb; --panel: #ffffff; --ink: #1f2733; --sub: #6b7686;
    --brand: #2f6df6; --brand-soft: #e8f0ff; --line: #e6eaf2;
    --tool: #0e9f6e; --tool-bg: #e6f7f1; --err: #d12d3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  header .logo { font-size: 20px; }
  header h1 { font-size: 16px; margin: 0; }
  header .sid { margin-left: auto; font-size: 12px; color: var(--sub); }
  #chat { flex: 1; overflow-y: auto; padding: 22px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; }
  .msg .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--brand-soft); }
  .msg.bot .avatar { background: #eef1f6; }
  .bubble {
    max-width: 82%; padding: 11px 14px; border-radius: 12px; font-size: 14.5px;
    line-height: 1.7; word-break: break-word; background: var(--panel);
    border: 1px solid var(--line); white-space: normal;
  }
  .msg.user .bubble { background: var(--brand); color: #fff; border-color: var(--brand); }
  .bubble pre {
    background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px;
    overflow-x: auto; font-size: 12.5px; line-height: 1.5; margin: 8px 0;
  }
  .bubble code { font-family: Consolas, monospace; }
  .bubble :not(pre) > code {
    background: #f1f4f9; padding: 1px 5px; border-radius: 4px; font-size: 13px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px 44px; }
  .chip {
    font-size: 12px; color: var(--tool); background: var(--tool-bg);
    padding: 3px 10px; border-radius: 999px;
  }
  .cursor { display: inline-block; width: 7px; height: 16px; background: var(--brand);
    vertical-align: -2px; margin-left: 2px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  footer { padding: 12px 16px 18px; background: var(--panel); border-top: 1px solid var(--line); }
  .inputbar { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  #input {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px; font-size: 14.5px; font-family: inherit; max-height: 120px;
  }
  #input:focus { outline: none; border-color: var(--brand); }
  #send {
    background: var(--brand); color: #fff; border: none; border-radius: 10px;
    padding: 0 22px; font-size: 14.5px; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--sub); }
</style>
</head>
<body>
<header>
  <span class="logo">🧭</span>
  <h1>Whither 旅行规划助手</h1>
  <span class="sid" id="sid"></span>
</header>

<main id="chat">
  <div class="wrap" id="messages"></div>
</main>

<footer>
  <div class="inputbar">
    <textarea id="input" rows="1" placeholder="想去哪里？例如：国庆从北京去成都玩 3 天，帮我规划行程并导出 PDF"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">Enter 发送，Shift+Enter 换行 · 会话 ID 保存在本地浏览器</div>
</footer>

<script>
const $messages = document.getElementById('messages');
const $input = document.getElementById('input');
const $send = document.getElementById('send');
const $sid = document.getElementById('sid');

let threadId = localStorage.getItem('whither_thread_id') || null;
if (threadId) $sid.textContent = '会话 ' + threadId;

const TOOL_LABELS = {
  search_travel_knowledge: '检索旅行知识库',
  list_supported_cities: '查看覆盖城市',
  search_web_info: '联网实时搜索',
  calculate_budget: '核算预算',
  generate_packing_list: '生成打包清单',
  export_itinerary_pdf: '生成 PDF 手册',
};
function toolLabel(name) {
  if (name.startsWith('query_12306')) return '查询 12306';
  return TOOL_LABELS[name] || name;
}

// 极简安全 Markdown：转义 → 代码块 → 行内代码 → 粗体 → 换行
function renderMarkdown(text) {
  const parts = [];
  const fence = /```(\w*)\n?([\s\S]*?)```/g;
  let last = 0, m;
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => s
    .replace(/`([^`\n]+)`/g, (_, c) => '<code>' + esc(c) + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  while ((m = fence.exec(text)) !== null) {
    parts.push(inline(esc(text.slice(last, m.index))));
    parts.push('<pre><code>' + esc(m[2].replace(/\n$/, '')) + '</code></pre>');
    last = m.index + m[0].length;
  }
  parts.push(inline(esc(text.slice(last))));
  return parts.join('');
}

function addMessage(role, text) {
  const row = document.createElement('div');
  row.className = 'msg ' + role;
  row.innerHTML =
    '<div class="avatar">' + (role === 'user' ? '🧑' : '🧭') + '</div>' +
    '<div class="bubble"></div>';
  const bubble = row.querySelector('.bubble');
  if (role === 'user') bubble.textContent = text;
  else bubble.innerHTML = renderMarkdown(text) + '<span class="cursor"></span>';
  $messages.appendChild(row);
  scroll();
  return bubble;
}

function scroll() {
  document.getElementById('chat').scrollTop = 1e9;
}

// 手动解析 SSE（EventSource 不支持 POST）
async function send() {
  const text = $input.value.trim();
  if (!text) return;
  $input.value = '';
  $input.style.height = 'auto';
  addMessage('user', text);
  $send.disabled = true;

  const bubble = addMessage('bot', '');
  let answer = '';
  let chips = null;
  const cursor = () => bubble.querySelector('.cursor');

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, thread_id: threadId }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const frames = buf.split(/\r?\n\r?\n/);
      buf = frames.pop();
      for (const frame of frames) {
        let event = 'message', data = '';
        for (const line of frame.split(/\r?\n/)) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (event === 'meta') {
          threadId = data;
          localStorage.setItem('whither_thread_id', threadId);
          $sid.textContent = '会话 ' + threadId;
        } else if (event === 'token') {
          answer += data;
          bubble.innerHTML = renderMarkdown(answer) + '<span class="cursor"></span>';
          scroll();
        } else if (event === 'tool') {
          if (!chips) {
            chips = document.createElement('div');
            chips.className = 'chips';
            $messages.insertBefore(chips, bubble.parentElement);
          }
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.textContent = '🔧 ' + toolLabel(data);
          chips.appendChild(chip);
          scroll();
        } else if (event === 'error') {
          answer += '\n\n⚠️ 出错了：' + data;
          bubble.innerHTML = renderMarkdown(answer);
        }
      }
    }
  } catch (e) {
    answer += '\n\n⚠️ 网络错误：' + e.message;
  }
  bubble.innerHTML = renderMarkdown(answer || '（无返回）');
  $send.disabled = false;
  $input.focus();
}

$send.addEventListener('click', send);
$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 120) + 'px';
});
$input.focus();
</script>
</body>
</html>
