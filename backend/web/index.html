<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whither · 何之旅行规划助手</title>
<style>
  :root {
    --bg: #f0f4f8; --panel: #ffffff; --ink: #1d3557; --sub: #6c757d;
    --brand: #0e7c7b; --brand-dark: #0a5d5c; --brand-soft: #e0f2f1;
    --accent: #f4795b; --accent-soft: #fce8e1;
    --line: #e0e8e8; --shadow: 0 2px 16px rgba(14,124,123,.08);
    --tool: #0e7c7b; --tool-bg: #e0f2f1; --err: #d12d3b;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--ink); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ===== 顶部导航 ===== */
  header {
    padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; z-index: 10;
    box-shadow: 0 1px 8px rgba(0,0,0,.03);
  }
  header .logo {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    box-shadow: 0 2px 8px rgba(14,124,123,.3);
  }
  header h1 { font-size: 17px; font-weight: 700; }
  header h1 small { font-weight: 400; color: var(--sub); font-size: 12px; margin-left: 4px; }
  header .sid { margin-left: auto; font-size: 12px; color: var(--sub); }
  header .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #4caf50;
    margin-right: 4px; display: inline-block; animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

  /* ===== 聊天区 ===== */
  #chat { flex: 1; overflow-y: auto; padding: 20px 16px; scroll-behavior: smooth; }
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  .wrap { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  /* ===== Hero 空状态 ===== */
  .hero {
    text-align: center; padding: 50px 20px 30px;
    animation: fadeInUp .6s ease;
  }
  .hero-icon {
    width: 80px; height: 80px; margin: 0 auto 18px; border-radius: 24px;
    background: linear-gradient(135deg, var(--brand) 0%, var(--accent) 100%);
    display: flex; align-items: center; justify-content: center; font-size: 40px;
    box-shadow: 0 8px 32px rgba(14,124,123,.25);
    animation: floatIcon 3s ease-in-out infinite;
  }
  @keyframes floatIcon { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .hero h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: var(--ink); }
  .hero p { font-size: 14px; color: var(--sub); margin-bottom: 24px; line-height: 1.6; }

  .quick-start { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .quick-chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 18px; font-size: 13px; cursor: pointer; transition: all .2s;
    display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow);
  }
  .quick-chip:hover {
    border-color: var(--brand); color: var(--brand); transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(14,124,123,.15);
  }
  .quick-chip .qs-icon { font-size: 16px; }

  /* 背景浮动装饰 */
  .float-deco { position: absolute; pointer-events: none; opacity: .06; font-size: 48px; }
  .float-deco.f1 { top: 80px; left: 8%; animation: floatX 8s ease-in-out infinite; }
  .float-deco.f2 { top: 200px; right: 10%; animation: floatX 10s ease-in-out infinite reverse; }
  .float-deco.f3 { top: 350px; left: 15%; animation: floatX 12s ease-in-out infinite; }
  @keyframes floatX { 0%,100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(20px,-15px) rotate(10deg); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== 消息气泡 ===== */
  .msg { display: flex; gap: 10px; animation: fadeInUp .35s ease; }
  .msg .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: linear-gradient(135deg, var(--accent) 0%, #e0654a 100%); }
  .msg.bot .avatar { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%); }
  .bubble {
    max-width: 80%; padding: 12px 16px; border-radius: var(--radius); font-size: 14.5px;
    line-height: 1.7; word-break: break-word; background: var(--panel);
    border: 1px solid var(--line); white-space: normal; box-shadow: var(--shadow);
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--accent) 0%, #e0654a 100%);
    color: #fff; border-color: transparent;
  }
  .bubble pre {
    background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px;
    overflow-x: auto; font-size: 12.5px; line-height: 1.5; margin: 8px 0;
  }
  .bubble code { font-family: Consolas, monospace; }
  .bubble :not(pre) > code {
    background: rgba(14,124,123,.08); padding: 1px 5px; border-radius: 4px; font-size: 13px;
  }
  .msg.user .bubble :not(pre) > code { background: rgba(255,255,255,.2); }

  /* 工具调用标签 */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px 46px; }
  .chip {
    font-size: 12px; color: var(--brand); background: var(--brand-soft);
    padding: 3px 10px; border-radius: 999px; border: 1px solid var(--brand)20;
    animation: fadeInUp .3s ease;
  }

  .cursor { display: inline-block; width: 7px; height: 16px; background: var(--brand);
    vertical-align: -2px; margin-left: 2px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== PDF 下载卡片 ===== */
  .pdf-card {
    margin-top: 10px; background: linear-gradient(135deg, var(--brand-soft) 0%, #fff 100%);
    border: 1px solid var(--brand)30; border-radius: 12px; padding: 16px 20px;
    display: flex; align-items: center; gap: 14px; animation: fadeInUp .4s ease;
  }
  .pdf-card .pdf-icon {
    width: 44px; height: 44px; border-radius: 10px; flex: none;
    background: linear-gradient(135deg, #d12d3b 0%, #a0222e 100%);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    box-shadow: 0 3px 10px rgba(209,45,59,.3);
  }
  .pdf-card .pdf-info { flex: 1; }
  .pdf-card .pdf-title { font-weight: 700; font-size: 14px; color: var(--ink); }
  .pdf-card .pdf-sub { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .pdf-card .pdf-btn {
    background: var(--brand); color: #fff; border: none; border-radius: 10px;
    padding: 9px 18px; font-size: 13px; cursor: pointer; font-weight: 600;
    transition: all .2s; display: flex; align-items: center; gap: 5px;
  }
  .pdf-card .pdf-btn:hover { background: var(--brand-dark); transform: scale(1.03); }

  /* ===== 偏好面板 ===== */
  .pref-toggle { max-width: 800px; margin: 0 auto 8px; text-align: center; }
  .pref-toggle button {
    background: var(--brand-soft); color: var(--brand); border: 1px solid var(--brand)40;
    border-radius: 999px; padding: 6px 18px; font-size: 13px; cursor: pointer;
    transition: all .2s; display: inline-flex; align-items: center; gap: 5px;
  }
  .pref-toggle button:hover { background: var(--brand); color: #fff; border-color: var(--brand); }

  .pref-panel {
    max-width: 800px; margin: 0 auto 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px;
    display: none; box-shadow: var(--shadow);
  }
  .pref-panel.open { display: block; animation: fadeInUp .3s ease; }
  .pref-panel h3 {
    font-size: 15px; margin-bottom: 14px; color: var(--ink);
    display: flex; align-items: center; gap: 6px;
  }
  .pref-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
  .pref-q {
    font-size: 13px; background: #f8fafb; border-radius: 10px; padding: 10px 14px;
    border: 1px solid var(--line); transition: border-color .2s;
  }
  .pref-q:hover { border-color: var(--brand)40; }
  .pref-q .pq-label { font-weight: 600; margin-bottom: 6px; color: var(--ink); }
  .pref-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .pref-opts label {
    background: #fff; padding: 4px 11px; border-radius: 8px; cursor: pointer;
    font-size: 12px; transition: all .15s; border: 1px solid var(--line);
  }
  .pref-opts input[type=radio] { display: none; }
  .pref-opts label:has(input:checked) {
    background: var(--brand); border-color: var(--brand); color: #fff;
    box-shadow: 0 2px 8px rgba(14,124,123,.25);
  }
  .pref-opts input[type=text] {
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px;
    font-size: 12px; width: 100%; margin-top: 5px; font-family: inherit;
  }
  .pref-opts input[type=text]:focus { outline: none; border-color: var(--brand); }
  .pref-submit { margin-top: 14px; text-align: center; }
  .pref-submit button {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    color: #fff; border: none; border-radius: 10px; padding: 9px 28px;
    font-size: 14px; cursor: pointer; font-weight: 600; transition: all .2s;
    box-shadow: 0 3px 12px rgba(14,124,123,.25);
  }
  .pref-submit button:hover { transform: translateY(-1px); box-shadow: 0 5px 18px rgba(14,124,123,.35); }

  /* ===== 底部输入栏 ===== */
  footer { padding: 12px 16px 16px; background: var(--panel); border-top: 1px solid var(--line); }
  .inputbar { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; }
  #input {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 15px; font-size: 14.5px; font-family: inherit; max-height: 120px;
    transition: border-color .2s; background: #f8fafb;
  }
  #input:focus { outline: none; border-color: var(--brand); background: #fff; }
  #send {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    color: #fff; border: none; border-radius: var(--radius);
    padding: 0 24px; font-size: 14.5px; cursor: pointer; font-weight: 600;
    transition: all .2s; box-shadow: 0 3px 12px rgba(14,124,123,.25);
  }
  #send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 18px rgba(14,124,123,.35); }
  #send:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 800px; margin: 6px auto 0; font-size: 12px; color: var(--sub); text-align: center; }
</style>
</head>
<body>

<!-- 背景浮动装饰 -->
<div class="float-deco f1">✈️</div>
<div class="float-deco f2">🗺️</div>
<div class="float-deco f3">🧳</div>

<header>
  <span class="logo">🧭</span>
  <h1>Whither <small>· 何之旅行规划助手</small></h1>
  <span class="sid" id="sid"><span class="status-dot"></span>在线</span>
</header>

<main id="chat">
  <div class="wrap" id="messages"></div>
</main>

<div class="pref-toggle"><button id="prefToggle">🎯 设置出行偏好</button></div>
<div class="pref-panel" id="prefPanel">
  <h3>🎯 出行偏好（填写后规划更精准）</h3>
  <div class="pref-grid">
    <div class="pref-q">
      <div class="pq-label">1️⃣ 出行节奏</div>
      <div class="pref-opts">
        <label><input type="radio" name="pace" value="轻松休闲"><span>轻松休闲</span></label>
        <label><input type="radio" name="pace" value="适中紧凑"><span>适中紧凑</span></label>
        <label><input type="radio" name="pace" value="特种兵式"><span>特种兵式</span></label>
      </div>
    </div>
    <div class="pref-q">
      <div class="pq-label">2️⃣ 预算水平</div>
      <div class="pref-opts">
        <label><input type="radio" name="budget" value="经济"><span>经济(&lt;500/天)</span></label>
        <label><input type="radio" name="budget" value="中等"><span>中等(500-1000/天)</span></label>
        <label><input type="radio" name="budget" value="宽裕"><span>宽裕(1000+/天)</span></label>
      </div>
    </div>
    <div class="pref-q">
      <div class="pq-label">3️⃣ 酒店偏好</div>
      <div class="pref-opts">
        <label><input type="radio" name="hotel" value="近地铁"><span>近地铁</span></label>
        <label><input type="radio" name="hotel" value="市中心商圈"><span>市中心商圈</span></label>
        <label><input type="radio" name="hotel" value="景区周边"><span>景区周边</span></label>
        <label><input type="radio" name="hotel" value="性价比"><span>性价比</span></label>
      </div>
    </div>
    <div class="pref-q">
      <div class="pq-label">4️⃣ 餐饮偏好</div>
      <div class="pref-opts">
        <label><input type="radio" name="food" value="本地特色"><span>本地特色</span></label>
        <label><input type="radio" name="food" value="网红打卡"><span>网红打卡</span></label>
        <label><input type="radio" name="food" value="家常菜"><span>家常菜</span></label>
        <label><input type="radio" name="food" value="不限"><span>不限</span></label>
      </div>
    </div>
    <div class="pref-q">
      <div class="pq-label">5️⃣ 交通偏好</div>
      <div class="pref-opts">
        <label><input type="radio" name="transport" value="公共交通"><span>公共交通</span></label>
        <label><input type="radio" name="transport" value="打车"><span>打车</span></label>
        <label><input type="radio" name="transport" value="租车"><span>租车自驾</span></label>
        <label><input type="radio" name="transport" value="混合"><span>混合</span></label>
      </div>
    </div>
    <div class="pref-q">
      <div class="pq-label">6️⃣ 第一站是否先去酒店</div>
      <div class="pref-opts">
        <label><input type="radio" name="hotel_first" value="true"><span>是，先放行李</span></label>
        <label><input type="radio" name="hotel_first" value="false"><span>否，直接游览</span></label>
      </div>
    </div>
    <div class="pref-q" style="grid-column: 1 / -1">
      <div class="pq-label">7️⃣ 特殊需求（自由填空）</div>
      <div class="pref-opts">
        <input type="text" name="special" placeholder="如：不吃辣、恐高、带老人小孩、需要无障碍等">
      </div>
    </div>
  </div>
  <div class="pref-submit"><button id="prefSend">填好了，开始规划</button></div>
</div>

<footer>
  <div class="inputbar">
    <textarea id="input" rows="1" placeholder="想去哪里？例如：国庆从北京去成都玩 3 天，帮我规划行程并导出 PDF"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">Enter 发送 · Shift+Enter 换行 · 会话 ID 保存在本地浏览器</div>
</footer>

<script>
const $messages = document.getElementById('messages');
const $input = document.getElementById('input');
const $send = document.getElementById('send');
const $sid = document.getElementById('sid');

let threadId = localStorage.getItem('whither_thread_id') || null;
if (threadId) $sid.innerHTML = '<span class="status-dot"></span>会话 ' + threadId;
let hasMessages = false;

const TOOL_LABELS = {
  search_travel_knowledge: '检索旅行知识库',
  list_supported_cities: '查看覆盖城市',
  search_web_info: '联网实时搜索',
  calculate_budget: '核算预算',
  generate_packing_list: '生成打包清单',
  export_itinerary_pdf: '生成 PDF 手册',
  plan_route_between_spots: '景点间交通查询',
};
function toolLabel(name) {
  if (name.startsWith('query_12306')) return '查询 12306';
  return TOOL_LABELS[name] || name;
}

// 快捷入口
const QUICK_STARTS = [
  { icon: '🐼', text: '成都3日游，帮我规划并导出PDF' },
  { icon: '🏛️', text: '北京周末2日游，历史人文为主' },
  { icon: '🌉', text: '上海3日亲子游，预算中等' },
  { icon: '🌊', text: '厦门3日海岛休闲游' },
];

function showHero() {
  const hero = document.createElement('div');
  hero.className = 'hero';
  hero.id = 'hero';
  hero.innerHTML = `
    <div class="hero-icon">🧭</div>
    <h2>你好，我是 Whither</h2>
    <p>你的智能旅行规划助手 · 覆盖国内 107 城<br>帮你规划行程、查天气、查车票、生成 PDF 手册</p>
    <div class="quick-start"></div>
  `;
  const qsContainer = hero.querySelector('.quick-start');
  QUICK_STARTS.forEach(qs => {
    const chip = document.createElement('div');
    chip.className = 'quick-chip';
    chip.innerHTML = `<span class="qs-icon">${qs.icon}</span> ${qs.text}`;
    chip.addEventListener('click', () => {
      $input.value = qs.text;
      $input.focus();
      $input.style.height = 'auto';
      $input.style.height = Math.min($input.scrollHeight, 120) + 'px';
    });
    qsContainer.appendChild(chip);
  });
  $messages.appendChild(hero);
}

// 极简安全 Markdown
function renderMarkdown(text) {
  const parts = [];
  const fence = /```(\w*)\n?([\s\S]*?)```/g;
  let last = 0, m;
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => s
    .replace(/`([^`\n]+)`/g, (_, c) => '<code>' + esc(c) + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  while ((m = fence.exec(text)) !== null) {
    parts.push(inline(esc(text.slice(last, m.index))));
    parts.push('<pre><code>' + esc(m[2].replace(/\n$/, '')) + '</code></pre>');
    last = m.index + m[0].length;
  }
  parts.push(inline(esc(text.slice(last))));
  return parts.join('');
}

// 检测 PDF 生成并显示下载卡片
function checkPdfCard(text, bubble) {
  const m = text.match(/PDF 手册已生成[:：]\s*data\/exports\/(.+\.pdf)/);
  if (!m) return;
  const filename = m[1];
  const existing = bubble.querySelector('.pdf-card');
  if (existing) return; // 避免重复
  const card = document.createElement('div');
  card.className = 'pdf-card';
  card.innerHTML = `
    <div class="pdf-icon">📄</div>
    <div class="pdf-info">
      <div class="pdf-title">行程手册已生成</div>
      <div class="pdf-sub">${filename}</div>
    </div>
    <button class="pdf-btn" onclick="window.open('/download/${encodeURIComponent(filename)}', '_blank')">
      ⬇ 下载 PDF
    </button>
  `;
  bubble.appendChild(card);
  scroll();
}

function addMessage(role, text) {
  if (!hasMessages) {
    const hero = document.getElementById('hero');
    if (hero) hero.remove();
    hasMessages = true;
  }
  const row = document.createElement('div');
  row.className = 'msg ' + role;
  row.innerHTML =
    '<div class="avatar">' + (role === 'user' ? '🧑' : '🧭') + '</div>' +
    '<div class="bubble"></div>';
  const bubble = row.querySelector('.bubble');
  if (role === 'user') bubble.textContent = text;
  else bubble.innerHTML = renderMarkdown(text) + '<span class="cursor"></span>';
  $messages.appendChild(row);
  scroll();
  return bubble;
}

function scroll() {
  document.getElementById('chat').scrollTop = 1e9;
}

// 手动解析 SSE
async function send() {
  const text = $input.value.trim();
  if (!text) return;
  $input.value = '';
  $input.style.height = 'auto';
  addMessage('user', text);
  $send.disabled = true;

  const bubble = addMessage('bot', '');
  let answer = '';
  let chips = null;

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, thread_id: threadId }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const frames = buf.split(/\r?\n\r?\n/);
      buf = frames.pop();
      for (const frame of frames) {
        let event = 'message', data = '';
        for (const line of frame.split(/\r?\n/)) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (event === 'meta') {
          threadId = data;
          localStorage.setItem('whither_thread_id', threadId);
          $sid.innerHTML = '<span class="status-dot"></span>会话 ' + threadId;
        } else if (event === 'token') {
          answer += data;
          bubble.innerHTML = renderMarkdown(answer) + '<span class="cursor"></span>';
          checkPdfCard(answer, bubble);
          scroll();
        } else if (event === 'tool') {
          if (!chips) {
            chips = document.createElement('div');
            chips.className = 'chips';
            $messages.insertBefore(chips, bubble.parentElement);
          }
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.textContent = '🔧 ' + toolLabel(data);
          chips.appendChild(chip);
          scroll();
        } else if (event === 'error') {
          answer += '\n\n⚠️ 出错了：' + data;
          bubble.innerHTML = renderMarkdown(answer);
        }
      }
    }
  } catch (e) {
    answer += '\n\n⚠️ 网络错误：' + e.message;
  }
  bubble.innerHTML = renderMarkdown(answer || '（无返回）');
  checkPdfCard(answer, bubble);
  $send.disabled = false;
  $input.focus();
}

$send.addEventListener('click', send);
$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 120) + 'px';
});

// ===== 偏好面板 =====
const $prefToggle = document.getElementById('prefToggle');
const $prefPanel = document.getElementById('prefPanel');
const $prefSend = document.getElementById('prefSend');

$prefToggle.addEventListener('click', () => {
  $prefPanel.classList.toggle('open');
  $prefToggle.textContent = $prefPanel.classList.contains('open')
    ? '收起偏好面板' : '🎯 设置出行偏好';
});

function collectPrefs() {
  const get = name => {
    const el = document.querySelector(`input[name="${name}"]:checked`);
    return el ? el.value : '';
  };
  const special = document.querySelector('input[name="special"]').value.trim();
  const parts = [];
  const pace = get('pace'); if (pace) parts.push('出行节奏=' + pace);
  const budget = get('budget'); if (budget) parts.push('预算=' + budget);
  const hotel = get('hotel'); if (hotel) parts.push('酒店偏好=' + hotel);
  const food = get('food'); if (food) parts.push('餐饮偏好=' + food);
  const transport = get('transport'); if (transport) parts.push('交通偏好=' + transport);
  const hf = get('hotel_first'); if (hf) parts.push('第一站先去酒店=' + (hf === 'true' ? '是' : '否'));
  if (special) parts.push('特殊需求=' + special);
  return parts.length ? '【出行偏好】' + parts.join('，') + '\n\n' : '';
}

$prefSend.addEventListener('click', () => {
  const prefs = collectPrefs();
  if (!prefs) { $input.focus(); return; }
  $input.value = prefs + ($input.value || '帮我规划行程并导出PDF');
  $prefPanel.classList.remove('open');
  $prefToggle.textContent = '🎯 设置出行偏好';
  $input.focus();
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 120) + 'px';
});

// 初始化：显示 Hero
showHero();
$input.focus();
</script>
