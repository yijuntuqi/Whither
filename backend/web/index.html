<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whither · 何之旅行规划助手</title>
<meta name="description" content="Whither 何之 — 智能旅行规划助手，覆盖国内107城，自动规划行程、查询天气车次、生成PDF攻略手册">
<meta name="theme-color" content="#0e7c7b">
<meta property="og:title" content="Whither · 何之旅行规划助手">
<meta property="og:description" content="智能旅行规划 Agent · 行程规划、天气、车次、PDF手册">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="assets/whither-logo.svg">
<style>
  :root {
    --bg: #eef3f4; --panel: #ffffff; --ink: #1d3557; --sub: #5f7280;
    --brand: #0e7c7b; --brand-dark: #0a5d5c; --brand-soft: #dcefee;
    --accent: #f4795b; --accent-dark: #e0654a;
    --line: #dde6e6; --radius: 16px;
    --shadow: 0 4px 20px rgba(14,124,123,.08);
    --shadow-lg: 0 12px 40px rgba(14,124,123,.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
    color: var(--ink); height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; overflow: hidden; position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* 氛围背景：青/橙 radial mesh + 角部等高线 + hero 背景图 */
  .ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(50rem 34rem at 8% -8%, rgba(14,124,123,.14), transparent 60%),
      radial-gradient(42rem 30rem at 102% 8%, rgba(244,121,91,.12), transparent 60%),
      radial-gradient(40rem 36rem at 60% 116%, rgba(72,202,228,.12), transparent 60%),
      var(--bg);
  }
  .ambient-bg-img { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: .38; filter: saturate(.9); }
  .ambient-bg-overlay { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(238,243,244,.62), rgba(238,243,244,.80)); }
  .ambient svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

  /* 顶部导航 */
  header {
    position: relative; z-index: 20; padding: 11px 22px;
    background: rgba(255,255,255,.72); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    padding: 5px; box-shadow: 0 3px 10px rgba(14,124,123,.28);
  }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  header h1 small { font-weight: 400; color: var(--sub); font-size: 12px; margin-left: 3px; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .sid { font-size: 12px; color: var(--sub); display: flex; align-items: center;
    font-variant-numeric: tabular-nums; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #43b87a;
    margin-right: 5px; animation: pulse 2.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(67,184,122,.4); }
    50% { opacity: .65; box-shadow: 0 0 0 4px rgba(67,184,122,0); } }
  .icon-btn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; font-size: 16px; display: flex; align-items: center;
    justify-content: center; transition: all .2s; color: var(--sub); }
  .icon-btn:hover { border-color: var(--brand); color: var(--brand); }

  /* 自带 Key 弹层 */
  .keypop { position: absolute; top: 58px; right: 22px; width: 320px; z-index: 50;
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow-lg); padding: 16px 18px; display: none; }
  .keypop.open { display: block; animation: popIn .2s ease; }
  @keyframes popIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .keypop h4 { font-size: 13.5px; margin-bottom: 8px; }
  .keypop input { width: 100%; border: 1px solid var(--line); border-radius: 9px;
    padding: 8px 11px; font-size: 12.5px; font-family: inherit; }
  .keypop input:focus { outline: none; border-color: var(--brand); }
  .keypop .keyrow { display: flex; gap: 8px; margin-top: 10px; }
  .keypop .keyrow button { flex: 1; border-radius: 9px; padding: 7px; font-size: 12.5px; cursor: pointer; }
  .keypop .keyrow .kb-clear { border: 1px solid var(--line); background: #fff; }
  .keypop .keyrow .kb-save { border: none; background: var(--brand); color: #fff; }

  /* 聊天区 */
  main#chat { flex:1; overflow-y: auto; padding: 22px 16px 8px; position: relative; z-index: 10; }
  main#chat::-webkit-scrollbar { width: 7px; }
  main#chat::-webkit-scrollbar-thumb { background: rgba(14,124,123,.25); border-radius: 4px; }
  .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }

  /* Hero 卡片 */
  .hero { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow-lg); animation: fadeInUp .55s ease; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .hero-banner { position: relative; height: 168px; display: flex; align-items: center;
    justify-content: center; overflow: hidden;
    background:
      radial-gradient(30rem 14rem at 20% -10%, rgba(72,202,228,.55), transparent 60%),
      linear-gradient(135deg, var(--brand-dark) 0%, var(--brand) 55%, #11918f 100%); }
  .hero-banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero-banner::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,93,92,.15), rgba(10,93,92,.45)); }
  .hero-banner .hb-logo { position: relative; z-index: 2; width: 70px; height: 70px;
    background: rgba(255,255,255,.16); backdrop-filter: blur(4px); border-radius: 18px; padding: 9px;
    border: 1px solid rgba(255,255,255,.25); animation: floatY 3.4s ease-in-out infinite; }
  @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .hero-body { padding: 22px 26px 24px; text-align: center; }
  .hero-body h2 { font-size: 23px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 8px; }
  .hero-body .h-sub { font-size: 13.5px; color: var(--sub); line-height: 1.7; margin-bottom: 19px;
    text-wrap: balance; }
  .hero-feats { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 19px; }
  .hfeat { font-size: 12px; color: var(--brand); background: var(--brand-soft);
    padding: 5px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
  .quick-start-label { font-size: 11px; color: var(--sub); letter-spacing: .08em; margin-bottom: 10px; }
  .quick-start { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
  .quick-chip { background: #f7faf9; border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 15px; font-size: 13px; cursor: pointer; transition: all .2s cubic-bezier(.2,.7,.3,1);
    display: flex; align-items: center; gap: 7px; }
  .quick-chip:hover { border-color: var(--brand); color: var(--brand); transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(14,124,123,.14); }
  .quick-chip:active { transform: translateY(0) scale(.98); }
  .quick-chip .qs-icon { font-size: 16px; }

  /* 消息气泡 */
  .msg { display: flex; gap: 11px; animation: fadeInUp .35s ease; }
  .avatar { width: 38px; height: 38px; border-radius: 12px; flex: none;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); font-size: 17px; }
  .msg.bot .avatar { background: linear-gradient(135deg, var(--brand), var(--brand-dark)); padding: 6px; }
  .bubble { max-width: 78%; padding: 12px 16px; border-radius: var(--radius); font-size: 14.5px;
    line-height: 1.72; word-break: break-word; background: var(--panel);
    border: 1px solid var(--line); box-shadow: var(--shadow); }
  .msg.user .bubble { background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff; border-color: transparent; border-top-right-radius: 5px; }
  .msg.bot .bubble { border-top-left-radius: 5px; }
  .bubble pre { background: #0f2027; color: #e2e8f0; padding: 13px; border-radius: 10px;
    overflow-x: auto; font-size: 12.5px; line-height: 1.55; margin: 8px 0; }
  .bubble :not(pre) > code { background: rgba(14,124,123,.1); padding: 1px 6px;
    border-radius: 5px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .msg.user .bubble :not(pre) > code { background: rgba(255,255,255,.22); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 4px 49px; }
  .chip { font-size: 11.5px; color: var(--brand); background: var(--brand-soft);
    padding: 4px 11px; border-radius: 999px; border: 1px solid rgba(14,124,123,.18);
    animation: fadeInUp .3s ease; }
  .cursor { display: inline-block; width: 7px; height: 15px; background: var(--brand);
    vertical-align: -2px; margin-left: 2px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* PDF 下载卡 */
  .pdf-card { margin-top: 12px; background: linear-gradient(135deg, var(--brand-soft), #fff 80%);
    border: 1px solid rgba(14,124,123,.25); border-radius: 13px; padding: 14px 16px;
    display: flex; align-items: center; gap: 13px; animation: fadeInUp .4s ease; }
  .pdf-card .pdf-icon { width: 44px; height: 44px; border-radius: 11px; flex: none;
    background: linear-gradient(135deg, #d12d3b, #a0222e); display: flex; align-items: center;
    justify-content: center; font-size: 21px; box-shadow: 0 3px 10px rgba(209,45,59,.3); }
  .pdf-card .pdf-title { font-weight: 700; font-size: 14px; }
  .pdf-card .pdf-sub { font-size: 11.5px; color: var(--sub); margin-top: 2px; }
  .pdf-card .pdf-btn { margin-left: auto; background: var(--brand); color: #fff; border: none;
    border-radius: 10px; padding: 9px 16px; font-size: 13px; cursor: pointer; font-weight: 600;
    transition: all .2s; display: flex; align-items: center; gap: 5px; }
  .pdf-card .pdf-btn:hover { background: var(--brand-dark); transform: translateY(-1px); }
  .pdf-card .pdf-btn:active { transform: scale(.97); }

  /* 偏好面板 */
  .pref-toggle { position: relative; z-index: 10; max-width: 820px; margin: 4px auto 0; text-align: center; }
  .pref-toggle button { background: rgba(255,255,255,.85); color: var(--brand);
    border: 1px solid rgba(14,124,123,.35); border-radius: 999px; padding: 7px 18px; font-size: 13px;
    cursor: pointer; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; }
  .pref-toggle button:hover { background: var(--brand); color: #fff; border-color: var(--brand); }
  .pref-panel { position: relative; z-index: 10; max-width: 820px; margin: 8px auto 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 22px; display: none; box-shadow: var(--shadow); }
  .pref-panel.open { display: block; animation: fadeInUp .3s ease; }
  .pref-panel h3 { font-size: 15px; margin-bottom: 14px; display: flex; align-items: center; gap: 7px; }
  .pref-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px 18px; }
  .pref-q { font-size: 13px; background: #f6f9f9; border-radius: 11px; padding: 11px 14px;
    border: 1px solid var(--line); transition: border-color .2s; }
  .pref-q:hover { border-color: rgba(14,124,123,.4); }
  .pq-label { font-weight: 600; margin-bottom: 7px; font-size: 12.5px; }
  .pref-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .pref-opts label { background: #fff; padding: 4px 11px; border-radius: 8px; cursor: pointer;
    font-size: 12px; transition: all .15s; border: 1px solid var(--line); }
  .pref-opts input[type=radio] { display: none; }
  .pref-opts label:has(input:checked) { background: var(--brand); border-color: var(--brand);
    color: #fff; box-shadow: 0 2px 8px rgba(14,124,123,.25); }
  .pref-opts input[type=text] { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    font-size: 12px; width: 100%; margin-top: 6px; font-family: inherit; }
  .pref-opts input[type=text]:focus { outline: none; border-color: var(--brand); }
  .pref-submit { margin-top: 14px; text-align: center; }
  .pref-submit button { background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    color: #fff; border: none; border-radius: 11px; padding: 9px 28px; font-size: 14px; cursor: pointer;
    font-weight: 600; transition: all .2s; box-shadow: 0 4px 14px rgba(14,124,123,.28); }
  .pref-submit button:hover { transform: translateY(-1px); box-shadow: 0 7px 20px rgba(14,124,123,.35); }
  .pref-submit button:active { transform: scale(.98); }

  /* 底部输入栏 */
  footer { position: relative; z-index: 20; padding: 16px 16px 20px;
    background: rgba(255,255,255,.8); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  .inputbar { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
  #input { flex: 1; resize: none; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 15px 18px; font-size: 15px; font-family: inherit; max-height: 140px;
    transition: border-color .2s, box-shadow .2s; background: #f7faf9; line-height: 1.55; }
  #input:focus { outline: none; border-color: var(--brand); background: #fff;
    box-shadow: 0 0 0 3px rgba(14,124,123,.12); }
  #send { background: linear-gradient(135deg, var(--brand), var(--brand-dark)); color: #fff;
    border: none; border-radius: var(--radius); padding: 0 32px; font-size: 15px; cursor: pointer;
    font-weight: 600; transition: all .2s; box-shadow: 0 4px 14px rgba(14,124,123,.28); }
  #send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 7px 20px rgba(14,124,123,.35); }
  #send:active:not(:disabled) { transform: scale(.98); }
  #send:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 820px; margin: 7px auto 0; font-size: 11.5px; color: var(--sub); text-align: center; }

  /* 轻提示 toast */
  .toast { position: fixed; left: 50%; bottom: 100px; z-index: 200;
    transform: translateX(-50%) translateY(10px); opacity: 0; pointer-events: none;
    background: var(--ink); color: #fff; font-size: 13px; padding: 10px 18px;
    border-radius: 11px; box-shadow: var(--shadow-lg); transition: all .25s ease;
    max-width: 88vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    .pref-grid { grid-template-columns: 1fr; }
    .bubble { max-width: 88%; }
    header h1 small { display: none; }
  }
</style>
</head>
<body>

<div class="ambient">
  <video class="ambient-bg-img" autoplay muted loop playsinline preload="auto"
    onerror="this.remove()"><source src="assets/hero-bg.mp4" type="video/mp4"></video>
  <div class="ambient-bg-overlay"></div>
  <svg viewBox="0 0 1440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#0e7c7b" stroke-width="1">
      <circle cx="180" cy="120" r="60" opacity=".18"/><circle cx="180" cy="120" r="100" opacity=".12"/>
      <circle cx="180" cy="120" r="150" opacity=".08"/>
    </g>
    <g fill="none" stroke="#f4795b" stroke-width="1">
      <circle cx="1300" cy="760" r="70" opacity=".16"/><circle cx="1300" cy="760" r="120" opacity=".1"/>
      <circle cx="1300" cy="760" r="170" opacity=".07"/>
    </g>
  </svg>
</div>

<header>
  <img class="logo" src="assets/whither-logo.svg" alt="Whither">
  <h1>Whither <small>何之旅行规划助手</small></h1>
  <div class="header-right">
    <span class="sid" id="sid"><span class="status-dot"></span>在线</span>
    <button class="icon-btn" id="keyBtn" title="设置你的模型 Key">🔑</button>
  </div>
</header>

<div class="keypop" id="keyPop">
  <h4>🔑 模型 API Key（必填）</h4>
  <p style="font-size:11.5px;color:var(--sub);line-height:1.5;margin-bottom:8px;">本站<b>不提供公共模型额度</b>，必须填写你自己的 OpenAI 兼容 Key 才能对话，请求走你自己的额度。Key 只保存在你的浏览器（localStorage），不会经过或存储在本站服务器。</p>
  <label style="font-size:11.5px;font-weight:600;">OpenAI API Key</label>
  <input type="password" id="llmKey" placeholder="sk-..." autocomplete="off">
  <label style="font-size:11.5px;font-weight:600;display:block;margin-top:8px;">API 地址（可选，默认官方）</label>
  <input type="text" id="llmBase" placeholder="https://api.openai.com/v1" autocomplete="off">
  <label style="font-size:11.5px;font-weight:600;display:block;margin-top:8px;">模型名（可选，默认 gpt-4o-mini）</label>
  <input type="text" id="llmModel" placeholder="gpt-4o-mini" autocomplete="off">
  <div class="keyrow">
    <button class="kb-clear" id="keyClear">清除</button>
    <button class="kb-save" id="keySave">保存</button>
  </div>
</div>

<main id="chat">
  <div class="wrap" id="messages"></div>
</main>

<div class="pref-toggle"><button id="prefToggle">🎯 设置出行偏好</button></div>
<div class="pref-panel" id="prefPanel">
  <h3>🎯 出行偏好（填写后规划更精准）</h3>
  <div class="pref-grid">
    <div class="pref-q">
      <div class="pq-label">1️⃣ 出行节奏</div>
      <div class="pref-opts">
        <label><input type="radio" name="pace" value="轻松休闲"><span>轻松休闲</span></label>
        <label><input type="radio" name="pace" value="适中紧凑"><span>适中紧凑</span></label>
        <label><input type="radio" name="pace" value="特种兵式"><span>特种兵式</span></label>
      </div>
    </div>
    <div class="pref-q">
      <div class="pq-label">2️⃣ 预算水平</div>
      <div class="pref-opts">
        <label><input type="radio" name="budget" value="经济"><span>经济(&lt;500/天)</span></label>
        <label><input type="radio" name="budget" value="中等"><span>中等(500-1000/天)</span></label>
        <label><input type="radio" name="budget" value="宽裕"><span>宽裕(1000+/天)</span></label>
      </div>
    </div>
    <div class="pref-q">
      <div class="pq-label">3️⃣ 酒店偏好</div>
      <div class="pref-opts">
        <label><input type="radio" name="hotel" value="近地铁"><span>近地铁</span></label>
        <label><input type="radio" name="hotel" value="市中心商圈"><span>市中心商圈</span></label>
        <label><input type="radio" name="hotel" value="景区周边"><span>景区周边</span></label>
        <label><input type="radio" name="hotel" value="性价比"><span>性价比</span></label>
      </div>
    </div>
    <div class="pref-q">
      <div class="pq-label">4️⃣ 餐饮偏好</div>
      <div class="pref-opts">
        <label><input type="radio" name="food" value="本地特色"><span>本地特色</span></label>
        <label><input type="radio" name="food" value="网红打卡"><span>网红打卡</span></label>
        <label><input type="radio" name="food" value="家常菜"><span>家常菜</span></label>
        <label><input type="radio" name="food" value="不限"><span>不限</span></label>
      </div>
    </div>
    <div class="pref-q">
      <div class="pq-label">5️⃣ 交通偏好</div>
      <div class="pref-opts">
        <label><input type="radio" name="transport" value="公共交通"><span>公共交通</span></label>
        <label><input type="radio" name="transport" value="打车"><span>打车</span></label>
        <label><input type="radio" name="transport" value="租车"><span>租车自驾</span></label>
        <label><input type="radio" name="transport" value="混合"><span>混合</span></label>
      </div>
    </div>
    <div class="pref-q">
      <div class="pq-label">6️⃣ 第一站是否先去酒店</div>
      <div class="pref-opts">
        <label><input type="radio" name="hotel_first" value="true"><span>是，先放行李</span></label>
        <label><input type="radio" name="hotel_first" value="false"><span>否，直接游览</span></label>
      </div>
    </div>
    <div class="pref-q" style="grid-column: 1 / -1">
      <div class="pq-label">7️⃣ 特殊需求（自由填空）</div>
      <div class="pref-opts">
        <input type="text" name="special" placeholder="如：不吃辣、恐高、带老人小孩、需要无障碍等">
      </div>
    </div>
  </div>
  <div class="pref-submit"><button id="prefSend">填好了，开始规划</button></div>
</div>

<footer>
  <div class="inputbar">
    <textarea id="input" rows="1" placeholder="想去哪里？例如：国庆从北京去成都玩 3 天，帮我规划行程并导出 PDF"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">使用前请先点右上角 🔑 填写自己的 API Key · Enter 发送 · Shift+Enter 换行</div>
</footer>

<div class="toast" id="toast"></div>

<script>
const $messages = document.getElementById('messages');
const $input = document.getElementById('input');
const $send = document.getElementById('send');
const $sid = document.getElementById('sid');

/* ===== 后端地址（同域部署，直接用相对路径）===== */
function apiUrl(path) { return path; }

let threadId = localStorage.getItem('whither_thread_id') || null;
function renderSid() {
  $sid.innerHTML = '<span class="status-dot"></span>' + (threadId ? '会话 ' + threadId : '在线');
}
renderSid();
let hasMessages = false;

const TOOL_LABELS = {
  search_travel_knowledge: '检索旅行知识库',
  list_supported_cities: '查看覆盖城市',
  search_web_info: '联网实时搜索',
  calculate_budget: '核算预算',
  generate_packing_list: '生成打包清单',
  export_itinerary_pdf: '生成 PDF 手册',
  plan_route_between_spots: '景点间交通查询',
};
function toolLabel(name) {
  if (name.startsWith('query_12306')) return '查询 12306';
  return TOOL_LABELS[name] || name;
}

const QUICK_STARTS = [
  { icon: '🐼', text: '成都3日游，帮我规划并导出PDF' },
  { icon: '🏛️', text: '北京周末2日游，历史人文为主' },
  { icon: '🌉', text: '上海3日亲子游，预算中等' },
  { icon: '🌊', text: '厦门3日海岛休闲游' },
];

function showHero() {
  const hero = document.createElement('div');
  hero.className = 'hero';
  hero.id = 'hero';
  hero.innerHTML = `
    <div class="hero-banner">
      <img src="assets/hero-bg.jpg" alt="" onerror="this.remove()">
      <img class="hb-logo" src="assets/whither-logo.svg" alt="Whither">
    </div>
    <div class="hero-body">
      <h2>你好，我是 Whither</h2>
      <p class="h-sub">你的智能旅行规划助手 · 覆盖国内 107 城<br>帮你规划行程、查天气、查车次、生成 PDF 手册</p>
      <div class="hero-feats">
        <span class="hfeat">📚 攻略知识库</span>
        <span class="hfeat">🌤️ 实时天气</span>
        <span class="hfeat">🚄 12306 车次</span>
        <span class="hfeat">🗺️ 真实交通</span>
      </div>
      <div class="quick-start-label">试试这些</div>
      <div class="quick-start"></div>
    </div>`;
  const qsContainer = hero.querySelector('.quick-start');
  QUICK_STARTS.forEach(qs => {
    const chip = document.createElement('div');
    chip.className = 'quick-chip';
    chip.innerHTML = `<span class="qs-icon">${qs.icon}</span> ${qs.text}`;
    chip.addEventListener('click', () => {
      $input.value = qs.text;
      autoGrow();
      $input.focus();
    });
    qsContainer.appendChild(chip);
  });
  $messages.appendChild(hero);
}

function renderMarkdown(text) {
  const parts = [];
  const fence = /```(\w*)\n?([\s\S]*?)```/g;
  let last = 0, m;
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = s => s
    .replace(/`([^`\n]+)`/g, (_,c) => '<code>' + esc(c) + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  while ((m = fence.exec(text)) !== null) {
    parts.push(inline(esc(text.slice(last, m.index))));
    parts.push('<pre><code>' + esc(m[2].replace(/\n$/,'')) + '</code></pre>');
    last = m.index + m[0].length;
  }
  parts.push(inline(esc(text.slice(last))));
  return parts.join('');
}

function checkPdfCard(text, bubble) {
  // 匹配多种格式：
  // 1) ✅ PDF 手册已生成: data/exports/xxx.pdf
  // 2) (sandbox:/app/data/exports/xxx.pdf) — markdown 链接里的 sandbox 协议
  // 3) 任何包含 data/exports/xxx.pdf 的文本
  let filename = null;
  let m = text.match(/data\/exports\/([^\s\)）]+?\.pdf)/);
  if (m) filename = m[1];
  if (!filename) return;
  if (bubble.querySelector('.pdf-card')) return;
  const card = document.createElement('div');
  card.className = 'pdf-card';
  card.innerHTML = `
    <div class="pdf-icon">📄</div>
    <div>
      <div class="pdf-title">行程手册已生成</div>
      <div class="pdf-sub">${filename}</div>
    </div>
    <button class="pdf-btn" data-file="${filename}">⬇ 下载 PDF</button>`;
  card.querySelector('.pdf-btn').addEventListener('click', e => {
    window.open(apiUrl('/download/' + encodeURIComponent(e.target.dataset.file)), '_blank');
  });
  bubble.appendChild(card);
  scroll();
}

function addMessage(role, text) {
  if (!hasMessages) {
    const hero = document.getElementById('hero');
    if (hero) hero.remove();
    hasMessages = true;
  }
  const row = document.createElement('div');
  row.className = 'msg ' + role;
  const avatarContent = role === 'user'
    ? '🧑'
    : '<img src="assets/whither-logo.svg" alt="Whither" style="width:22px;height:22px">';
  row.innerHTML = '<div class="avatar">' + avatarContent + '</div><div class="bubble"></div>';
  const bubble = row.querySelector('.bubble');
  if (role === 'user') bubble.textContent = text;
  else bubble.innerHTML = renderMarkdown(text) + '<span class="cursor"></span>';
  $messages.appendChild(row);
  scroll();
  return bubble;
}

function scroll() { document.getElementById('chat').scrollTop = 1e9; }

let toastTimer = null;
function showToast(msg) {
  const $t = document.getElementById('toast');
  $t.textContent = msg;
  $t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $t.classList.remove('show'), 3200);
}

async function send() {
  const text = $input.value.trim();
  if (!text) return;
  // 硬门槛：必须先填用户自己的模型 Key，本站不提供公共额度
  if (!readUserKeys()) {
    loadKeyInputs();
    $keyPop.classList.add('open');
    $llmKey.focus();
    showToast('请先填写你自己的模型 API Key（右上角 🔑）');
    return;
  }
  $input.value = '';
  autoGrow();
  addMessage('user', text);
  $send.disabled = true;

  const bubble = addMessage('bot', '');
  let answer = '', chips = null;

  try {
    // 用户自带的 LLM Key（存于 localStorage），可选随请求发送
    const apiKeys = readUserKeys();
    const body = { message: text, thread_id: threadId };
    if (apiKeys) body.api_keys = apiKeys;
    const resp = await fetch(apiUrl('/chat'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    // 后端在缺少 Key 等情况下返回 4xx JSON：解析 detail 并提示
    if (!resp.ok) {
      let detail = '';
      try { detail = (await resp.json()).detail || ''; } catch {}
      throw new Error(detail || ('服务返回错误（HTTP ' + resp.status + '）'));
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const frames = buf.split(/\r?\n\r?\n/);
      buf = frames.pop();
      for (const frame of frames) {
        let event = 'message', data = '';
        for (const line of frame.split(/\r?\n/)) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (event === 'meta') {
          threadId = data;
          localStorage.setItem('whither_thread_id', threadId);
          renderSid();
        } else if (event === 'token') {
          answer += data;
          bubble.innerHTML = renderMarkdown(answer) + '<span class="cursor"></span>';
          checkPdfCard(answer, bubble);
          scroll();
        } else if (event === 'tool') {
          if (!chips) {
            chips = document.createElement('div');
            chips.className = 'chips';
            $messages.insertBefore(chips, bubble.parentElement);
          }
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.textContent = '🔧 ' + toolLabel(data);
          chips.appendChild(chip);
          scroll();
        } else if (event === 'error') {
          answer += '\n\n⚠️ 出错了：' + data;
          bubble.innerHTML = renderMarkdown(answer);
        }
      }
    }
  } catch (e) {
    answer += '\n\n⚠️ 网络错误：' + e.message;
  }
  bubble.innerHTML = renderMarkdown(answer || '（无返回）');
  checkPdfCard(answer, bubble);
  $send.disabled = false;
  $input.focus();
}

function autoGrow() {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 120) + 'px';
}

$send.addEventListener('click', send);
$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$input.addEventListener('input', autoGrow);

/* ===== 偏好面板 ===== */
const $prefToggle = document.getElementById('prefToggle');
const $prefPanel = document.getElementById('prefPanel');
$prefToggle.addEventListener('click', () => {
  $prefPanel.classList.toggle('open');
  $prefToggle.textContent = $prefPanel.classList.contains('open')
    ? '收起偏好面板' : '🎯 设置出行偏好';
});
function collectPrefs() {
  const get = name => { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : ''; };
  const special = document.querySelector('input[name="special"]').value.trim();
  const parts = [];
  const pace = get('pace'); if (pace) parts.push('出行节奏=' + pace);
  const budget = get('budget'); if (budget) parts.push('预算=' + budget);
  const hotel = get('hotel'); if (hotel) parts.push('酒店偏好=' + hotel);
  const food = get('food'); if (food) parts.push('餐饮偏好=' + food);
  const transport = get('transport'); if (transport) parts.push('交通偏好=' + transport);
  const hf = get('hotel_first'); if (hf) parts.push('第一站先去酒店=' + (hf === 'true' ? '是' : '否'));
  if (special) parts.push('特殊需求=' + special);
  return parts.length ? '【出行偏好】' + parts.join('，') + '\n\n' : '';
}
document.getElementById('prefSend').addEventListener('click', () => {
  const prefs = collectPrefs();
  if (!prefs) { $input.focus(); return; }
  $input.value = prefs + ($input.value || '帮我规划行程并导出PDF');
  $prefPanel.classList.remove('open');
  $prefToggle.textContent = '🎯 设置出行偏好';
  autoGrow();
  $input.focus();
});

/* ===== 自带模型 Key ===== */
function readUserKeys() {
  const k = localStorage.getItem('whither_user_llm_api_key');
  const base = localStorage.getItem('whither_user_llm_api_base');
  const model = localStorage.getItem('whither_user_llm_model');
  const v = { llm_api_key: k || '' };
  if (base) v.llm_api_base = base;
  if (model) v.llm_model = model;
  return v && v.llm_api_key ? v : null;
}
const $keyBtn = document.getElementById('keyBtn');
const $keyPop = document.getElementById('keyPop');
const $llmKey = document.getElementById('llmKey');
const $llmBase = document.getElementById('llmBase');
const $llmModel = document.getElementById('llmModel');
function loadKeyInputs() {
  $llmKey.value = localStorage.getItem('whither_user_llm_api_key') || '';
  $llmBase.value = localStorage.getItem('whither_user_llm_api_base') || '';
  $llmModel.value = localStorage.getItem('whither_user_llm_model') || '';
}
$keyBtn.addEventListener('click', e => {
  e.stopPropagation();
  loadKeyInputs();
  $keyPop.classList.toggle('open');
});
document.addEventListener('click', e => {
  if (!$keyPop.contains(e.target) && e.target !== $keyBtn) $keyPop.classList.remove('open');
});
document.getElementById('keySave').addEventListener('click', () => {
  const k = $llmKey.value.trim();
  if (k) localStorage.setItem('whither_user_llm_api_key', k);
  else localStorage.removeItem('whither_user_llm_api_key');
  const base = $llmBase.value.trim();
  if (base) localStorage.setItem('whither_user_llm_api_base', base); else localStorage.removeItem('whither_user_llm_api_base');
  const model = $llmModel.value.trim();
  if (model) localStorage.setItem('whither_user_llm_model', model); else localStorage.removeItem('whither_user_llm_model');
  $keyPop.classList.remove('open');
});
document.getElementById('keyClear').addEventListener('click', () => {
  localStorage.removeItem('whither_user_llm_api_key');
  localStorage.removeItem('whither_user_llm_api_base');
  localStorage.removeItem('whither_user_llm_model');
  loadKeyInputs();
  $keyPop.classList.remove('open');
});

showHero();
autoGrow();
$input.focus();
</script>
</body>
</html>
